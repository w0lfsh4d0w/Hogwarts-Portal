services:
  app:
    build: .
    ports:
      - "8888:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hogwarts_db
      DB_USERNAME: root
      DB_PASSWORD: MyRoot@1234
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: MyRoot@1234
      MYSQL_DATABASE: hogwarts_db
    volumes:
      - db_data:/var/lib/mysql
      - ./Core/DB/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  db_data:
